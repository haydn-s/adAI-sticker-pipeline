[project]
name = "adai-sticker"
version = "0.1.0"
description = "Design, optimize, and evaluate printable adversarial stickers against image classifiers — a teaching tool for adversarial AI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
authors = [{ name = "Haydn Stucker" }]
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "open_clip_torch>=2.26",
    "numpy>=1.26",
    "pillow>=10.0",
    "matplotlib>=3.8",
]

[project.scripts]
adai-sticker = "adai_sticker.cli:main"

[project.optional-dependencies]
demo = [
    "opencv-python>=4.9",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adai_sticker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
