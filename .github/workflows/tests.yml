name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # CPU-only PyTorch keeps the install small; the tests use a tiny stand-in model.
      - name: Install
        run: |
          uv venv
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[web,streamlit]" pytest ruff httpx
      - name: Lint
        run: uv run --no-sync ruff check src tests deploy
      - name: Test
        run: uv run --no-sync pytest
